version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: dim_product
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: list_price
        tests:
          - not_null

  - name: dim_product_category
    columns:
      - name: product_category_id
        tests:
          - unique
          - not_null
      - name: business_category
        tests:
          - accepted_values:
              values: ['Bikes', 'Components', 'Clothing', 'Accessories', 'Others']

  - name: dim_date
    columns:
      - name: date_key
        tests:
          - unique
          - not_null

  - name: fact_sales
    columns:
      - name: sales_order_detail_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: net_sales
        tests:
          - not_null